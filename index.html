<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automate Accelerator — Amjad-Sales-Sheriffs-Analytics-Dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <style>
    :root {
      --bg: #0d0d0d;
      --bg-elevated: #141414;
      --card: rgba(255,255,255,0.04);
      --card-border: rgba(255,255,255,0.06);
      --card-hover: rgba(255,255,255,0.07);
      --orange: #e8711a;
      --orange-glow: rgba(232,113,26,0.25);
      --orange-soft: #f59e3f;
      --orange-dim: rgba(232,113,26,0.12);
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.15);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.15);
      --text: #f0ece4;
      --text-secondary: #a09a90;
      --text-muted: #5a5650;
      --divider: rgba(255,255,255,0.06);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: rgba(13,13,13,0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--divider);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-logo {
      height: 46px;
      width: auto;
    }

    .header-center {
      text-align: center;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .header-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .header-subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: var(--green);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green), 0 0 16px rgba(34,197,94,0.3);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--green), 0 0 16px rgba(34,197,94,0.3); }
      50% { opacity: 0.6; box-shadow: 0 0 4px var(--green); }
    }

    /* ── KPI Cards ── */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 20px 24px;
    }

    .kpi-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(12px);
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .kpi-card:hover {
      background: var(--card-hover);
      border-color: rgba(232,113,26,0.15);
      box-shadow: 0 0 20px rgba(232,113,26,0.06);
    }

    .kpi-label {
      font-size: 12px;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .kpi-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--orange-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .kpi-icon svg {
      width: 14px;
      height: 14px;
      stroke: var(--orange);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .kpi-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1.1;
    }

    .kpi-value.green { color: var(--green); }
    .kpi-value.red { color: var(--red); }

    .kpi-delta {
      font-size: 12px;
      margin-top: 4px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
    }

    /* ── Main Layout ── */
    .main-layout {
      display: grid;
      grid-template-columns: 220px 1fr 240px;
      gap: 16px;
      padding: 0 24px 20px;
      min-height: calc(100vh - 280px);
    }

    /* ── Panels ── */
    .panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .panel-header {
      padding: 16px 16px 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--divider);
    }

    .sdr-list {
      list-style: none;
      max-height: 500px;
      overflow-y: auto;
    }

    .sdr-list::-webkit-scrollbar { width: 4px; }
    .sdr-list::-webkit-scrollbar-track { background: transparent; }
    .sdr-list::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 4px; }

    .sdr-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.15s;
      border-left: 3px solid transparent;
    }

    .sdr-item:hover { background: var(--card-hover); }

    .sdr-item.active {
      background: var(--orange-dim);
      border-left-color: var(--orange);
    }

    .sdr-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sdr-count {
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--orange);
      background: var(--orange-dim);
      padding: 2px 8px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    /* ── Center Table ── */
    .table-section {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .table-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--divider);
    }

    .table-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .table-search {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--text);
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      outline: none;
      width: 200px;
      transition: border-color 0.2s;
    }

    .table-search:focus { border-color: var(--orange); }
    .table-search::placeholder { color: var(--text-muted); }

    .table-wrap {
      overflow-x: auto;
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--bg-elevated);
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      border-bottom: 1px solid var(--divider);
    }

    tbody tr {
      border-bottom: 1px solid var(--divider);
      transition: background 0.15s;
    }

    tbody tr:hover { background: rgba(232,113,26,0.04); }

    tbody td {
      padding: 10px 14px;
      color: var(--text);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .badge.approved { background: var(--green-dim); color: var(--green); }
    .badge.rejected { background: var(--red-dim); color: var(--red); }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .badge.approved .badge-dot { background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,0.5); }
    .badge.rejected .badge-dot { background: var(--red); box-shadow: 0 0 6px rgba(239,68,68,0.5); }

    /* ── Performance Panel ── */
    .perf-section {
      padding: 16px;
      border-bottom: 1px solid var(--divider);
    }

    .perf-section:last-child { border-bottom: none; }

    .perf-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .perf-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .perf-rank {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--orange);
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .perf-info { flex: 1; min-width: 0; }

    .perf-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .perf-bar-track {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      margin-top: 4px;
      overflow: hidden;
    }

    .perf-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--orange), var(--orange-soft));
      transition: width 0.6s ease;
    }

    .perf-bar-fill.low {
      background: linear-gradient(90deg, var(--red), #f87171);
    }

    .perf-count {
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      flex-shrink: 0;
    }

    /* ── Summary Bar ── */
    .summary-bar {
      display: flex;
      justify-content: center;
      gap: 48px;
      padding: 14px 24px;
      background: var(--card);
      border-top: 1px solid var(--divider);
      backdrop-filter: blur(12px);
    }

    .summary-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .summary-label { color: var(--text-secondary); font-weight: 500; }

    .summary-value {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .summary-sep {
      width: 1px;
      height: 20px;
      background: var(--divider);
      box-shadow: 0 0 8px var(--orange-glow);
    }

    /* ── States ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px; height: 48px;
      stroke: var(--text-muted); fill: none;
      stroke-width: 1.5;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state p { font-size: 14px; max-width: 280px; }
    .empty-state .hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

    .loading-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--card-border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-banner {
      background: var(--red-dim);
      color: var(--red);
      padding: 10px 24px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    /* ── Responsive ── */
    @media (max-width: 1024px) {
      .main-layout { grid-template-columns: 1fr; }
      .header-center { position: static; transform: none; }
      .header { flex-wrap: wrap; gap: 8px; justify-content: center; }
      .kpi-strip { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .kpi-strip { grid-template-columns: 1fr; padding: 12px 16px; }
      .main-layout { padding: 0 16px 16px; }
      .header { padding: 12px 16px; }
      .summary-bar { flex-wrap: wrap; gap: 16px; padding: 12px 16px; }
    }
  </style>
</head>

              <th>Client</th>
              <th>Campaign</th>
              <th>Date</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="6"><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Performance Panel -->
    <div class="panel">
      <div class="perf-section">
        <div class="perf-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round"><path d="M6 9l6-6 6 6"/><path d="M12 3v18"/></svg>
          Top Performers
        </div>
        <div id="topPerformers">
          <div class="loading-overlay" style="padding:20px"><div class="spinner"></div></div>
        </div>
      </div>
      <div class="perf-section">
        <div class="perf-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round"><path d="M18 15l-6 6-6-6"/><path d="M12 21V3"/></svg>
          Low Performers
        </div>
        <div id="lowPerformers">
          <div class="loading-overlay" style="padding:20px"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Summary Bar -->
  <div class="summary-bar">
    <div class="summary-item">
      <span class="summary-label">Total Appointments</span>
      <span class="summary-value" id="sumTotal">–</span>
    </div>
    <div class="summary-sep"></div>
    <div class="summary-item">
      <span class="summary-label">Approved</span>
      <span class="summary-value" style="color:var(--green)" id="sumApproved">–</span>
    </div>
    <div class="summary-sep"></div>
    <div class="summary-item">
      <span class="summary-label">Rejected</span>
      <span class="summary-value" style="color:var(--red)" id="sumRejected">–</span>
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    const SHEET_ID = '1vuZdmGt21zKGgQ2whmeLZh1L4SqU0LjFjK4u8WrefeY';
    const REFRESH_MS = 30000;

    // Column indices from sheet headers:
    // A=Date, B=SDR, C=CLIENT, D=Campaign, E=Organisation,
    // F=Industry, G=Website, H=Linkedin, I=Email, J=Phone,
    // K=Lead Source, L=BDM Distribution, M=REMARKS, N=STATUS, O=QA SELF OBSERVED
    const COL = { DATE: 0, SDR: 1, CLIENT: 2, CAMPAIGN: 3, ORG: 4, STATUS: 13 };

    let allRows = [];
    let activeSdr = null;
    let fetchCount = 0;

    // ── Data fetching via JSONP (works cross-origin, no CORS issues) ──
    function fetchData() {
      const cbName = '__gvizCb' + (++fetchCount);
      const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID
        + '/gviz/tq?tqx=responseHandler:' + cbName;

      window[cbName] = function(response) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        try {
          processData(response);
        } catch (e) {
          console.error('Process error:', e);
          processData(null);
        }
      };

      var script = document.createElement('script');
      script.src = url;
      script.onerror = function() {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        console.error('JSONP load failed');
        showError('Unable to reach Google Sheets. Will retry…');
        processData(null);
      };
      document.head.appendChild(script);
    }

    function processData(data) {
      hideError();
      allRows = [];

      if (data && data.table && data.table.rows) {
        var rows = data.table.rows;
        for (var i = 0; i < rows.length; i++) {
          var cells = rows[i].c;
          if (!cells) continue;

          var sdr = cellVal(cells, COL.SDR);
          if (!sdr || sdr.toUpperCase() === 'SDR') continue;

          allRows.push({
            sdr:      sdr,
            client:   cellVal(cells, COL.CLIENT),
            campaign: cellVal(cells, COL.CAMPAIGN),
            status:   cellVal(cells, COL.STATUS).toUpperCase(),
            date:     cellVal(cells, COL.DATE),
            org:      cellVal(cells, COL.ORG)
          });
        }
      }

      updateDashboard();
      updateTimestamp();
    }

    function cellVal(cells, idx) {
      if (!cells[idx]) return '';
      var c = cells[idx];
      if (c.v !== null && c.v !== undefined) return String(c.v).trim();
      if (c.f) return String(c.f).trim();
      return '';
    }

    // ── Dashboard rendering ──
    function updateDashboard() {
      var filtered = activeSdr ? allRows.filter(function(r) { return r.sdr === activeSdr; }) : allRows;

      var approvedCount = 0, rejectedCount = 0;
      allRows.forEach(function(r) {
        if (r.status === 'APPROVED' || r.status === 'APPROVE') approvedCount++;
        if (r.status === 'REJECTED' || r.status === 'REJECT') rejectedCount++;
      });

      var total = allRows.length;
      var rate = total > 0 ? ((approvedCount / total) * 100).toFixed(1) : '0.0';

      document.getElementById('kpiTotal').textContent = total.toLocaleString();
      document.getElementById('kpiRate').textContent = rate + '%';
      document.getElementById('kpiRateSub').textContent = total > 0
        ? approvedCount + ' of ' + total + ' approved' : '';
      document.getElementById('kpiApproved').textContent = approvedCount.toLocaleString();
      document.getElementById('kpiRejected').textContent = rejectedCount.toLocaleString();

      document.getElementById('sumTotal').textContent = total.toLocaleString();
      document.getElementById('sumApproved').textContent = approvedCount.toLocaleString();
      document.getElementById('sumRejected').textContent = rejectedCount.toLocaleString();

      renderSdrList();
      renderTable(filtered);
      renderPerformance();
    }

    function renderSdrList() {
      var sdrMap = {};
      allRows.forEach(function(r) {
        if (!sdrMap[r.sdr]) sdrMap[r.sdr] = { total: 0, approved: 0 };
        sdrMap[r.sdr].total++;
        if (r.status === 'APPROVED' || r.status === 'APPROVE') sdrMap[r.sdr].approved++;
      });

      var sdrs = Object.entries(sdrMap).sort(function(a, b) { return b[1].approved - a[1].approved; });
      var list = document.getElementById('sdrList');

      if (sdrs.length === 0) {
        list.innerHTML =
          '<li class="empty-state" style="padding:30px 16px">' +
            '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;margin-bottom:8px">' +
              '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/>' +
              '<circle cx="9" cy="7" r="4"/>' +
              '<path d="M23 21v-2a4 4 0 00-3-3.87"/>' +
              '<path d="M16 3.13a4 4 0 010 7.75"/>' +
            '</svg>' +
            '<p style="font-size:12px">No SDR data yet</p>' +
          '</li>';
        return;
      }

      list.innerHTML = sdrs.map(function(entry) {
        var name = entry[0], data = entry[1];
        return '<li class="sdr-item' + (activeSdr === name ? ' active' : '') +
          '" data-sdr="' + esc(name) + '">' +
          '<span class="sdr-name">' + esc(name) + '</span>' +
          '<span class="sdr-count">' + data.approved + '</span>' +
          '</li>';
      }).join('');

      list.querySelectorAll('.sdr-item').forEach(function(item) {
        item.addEventListener('click', function() {
          var sdr = item.getAttribute('data-sdr');
          activeSdr = activeSdr === sdr ? null : sdr;
          updateDashboard();
        });
      });
    }

    function renderTable(rows) {
      var tbody = document.getElementById('tableBody');
      var search = (document.getElementById('tableSearch').value || '').toLowerCase();

      var display = rows;
      if (search) {
        display = display.filter(function(r) {
          return r.sdr.toLowerCase().indexOf(search) !== -1 ||
            r.client.toLowerCase().indexOf(search) !== -1 ||
            r.campaign.toLowerCase().indexOf(search) !== -1;
        });
      }

      if (display.length === 0) {
        tbody.innerHTML =
          '<tr><td colspan="6">' +
            '<div class="empty-state">' +
              '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
                '<rect x="2" y="2" width="20" height="20" rx="2"/>' +
                '<path d="M7 10h10M7 14h6"/>' +
              '</svg>' +
              '<p>' + (allRows.length === 0
                ? 'No data in the connected Google Sheet yet.<br>Add records and they will appear here automatically.'
                : 'No matching records found.') + '</p>' +
              '<span class="hint">Auto-refreshes every 30 seconds</span>' +
            '</div>' +
          '</td></tr>';
        return;
      }

      tbody.innerHTML = display.map(function(r, i) {
        var isApproved = r.status === 'APPROVED' || r.status === 'APPROVE';
        var isRejected = r.status === 'REJECTED' || r.status === 'REJECT';
        var badgeClass = isApproved ? 'approved' : (isRejected ? 'rejected' : '');
        var statusLabel = isApproved ? 'Approved' : (isRejected ? 'Rejected' : (r.status || '—'));

        return '<tr>' +
          '<td style="color:var(--text-muted)">' + (i + 1) + '</td>' +
          '<td><strong>' + esc(r.sdr) + '</strong></td>' +
          '<td>' + esc(r.client || '—') + '</td>' +
          '<td>' + esc(r.campaign || '—') + '</td>' +
          '<td style="color:var(--text-secondary)">' + esc(r.date || '—') + '</td>' +
          '<td>' + (badgeClass
            ? '<span class="badge ' + badgeClass + '"><span class="badge-dot"></span>' + statusLabel + '</span>'
            : '<span style="color:var(--text-muted)">' + statusLabel + '</span>') +
          '</td>' +
          '</tr>';
      }).join('');
    }

    function renderPerformance() {
      var sdrMap = {};
      allRows.forEach(function(r) {
        if (!sdrMap[r.sdr]) sdrMap[r.sdr] = { total: 0, approved: 0 };
        sdrMap[r.sdr].total++;
        if (r.status === 'APPROVED' || r.status === 'APPROVE') sdrMap[r.sdr].approved++;
      });

      var sorted = Object.entries(sdrMap).sort(function(a, b) { return b[1].approved - a[1].approved; });
      var maxApproved = sorted.length > 0 ? sorted[0][1].approved : 1;

      var topEl = document.getElementById('topPerformers');
      if (sorted.length === 0) {
        topEl.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:8px 0">No data yet</div>';
      } else {
        topEl.innerHTML = sorted.slice(0, 3).map(function(entry, i) {
          var name = entry[0], data = entry[1];
          return '<div class="perf-item">' +
            '<span class="perf-rank">' + (i + 1) + '</span>' +
            '<div class="perf-info">' +
              '<div class="perf-name">' + esc(name) + '</div>' +
              '<div class="perf-bar-track">' +
                '<div class="perf-bar-fill" style="width:' + (data.approved / maxApproved * 100).toFixed(0) + '%"></div>' +
              '</div>' +
            '</div>' +
            '<span class="perf-count">' + data.approved + '</span>' +
            '</div>';
        }).join('');
      }

      var lowEl = document.getElementById('lowPerformers');
      if (sorted.length < 4) {
        lowEl.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:8px 0">Need more SDRs to compare</div>';
      } else {
        lowEl.innerHTML = sorted.slice(-3).reverse().map(function(entry) {
          var name = entry[0], data = entry[1];
          return '<div class="perf-item">' +
            '<span class="perf-rank" style="color:var(--red)">—</span>' +
            '<div class="perf-info">' +
              '<div class="perf-name">' + esc(name) + '</div>' +
              '<div class="perf-bar-track">' +
                '<div class="perf-bar-fill low" style="width:' + (data.approved / maxApproved * 100).toFixed(0) + '%"></div>' +
              '</div>' +
            '</div>' +
            '<span class="perf-count" style="color:var(--red)">' + data.approved + '</span>' +
            '</div>';
        }).join('');
      }
    }

    function updateTimestamp() {
      var now = new Date();
      document.getElementById('lastUpdated').textContent =
        now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ', ' +
        now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function showError(msg) {
      var el = document.getElementById('errorBanner');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBanner').style.display = 'none';
    }

    function esc(str) {
      var d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // Search handler
    document.getElementById('tableSearch').addEventListener('input', function() {
      var filtered = activeSdr ? allRows.filter(function(r) { return r.sdr === activeSdr; }) : allRows;
      renderTable(filtered);
    });

    // Initial fetch + auto-refresh
    fetchData();
    setInterval(fetchData, REFRESH_MS);
  })();
  </script>

</body>
</html>
